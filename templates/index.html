<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple KVM</title>
    <script src="/static/app.js" defer></script>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="shortcut icon" href="/static/assets/favicon.png" type="image/x-icon">
</head>

<body>
    <header>
        <h1><img src="/static/assets/favicon.png" alt="" class="logo">Simple KVM</h1>
		<div class="actions">
			<button id="dlbtn">Screenshot</button>
            <form method="POST" action="/logout"><button>Log out</button></form>
		</div>
    </header>

    <main>
        <div id="frame"><img id="screen" src="/stream" alt="console"></div>
    </main>

    <div id="keybar">
        <button id="kbtn" aria-label="Show keyboard">&#x2328;&#xFE0E;</button>
        <button data-key="ControlLeft" data-toggle>Ctrl</button>
        <button data-key="Tab">Tab</button>
        <span class="spacer"></span>
        <button data-key="ArrowLeft">&larr;</button>
        <button data-key="ArrowUp">&uarr;</button>
        <button data-key="ArrowDown">&darr;</button>
        <button data-key="ArrowRight">&rarr;</button>
    </div>

    <input id="kbin" type="password" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="enter" data-lpignore="true" data-1p-ignore>

    <div id="overlay">
        <div class="login-container">
            <h1><img src="/static/assets/favicon.png" alt="" class="logo">Simple KVM</h1>
            <p>You've been signed out due to inactivity<br>or because you signed in on another device</p>
            <form action="/login" method="GET">
                <button type="submit">Sign in again</button>
            </form>
        </div>
    </div>
</body>

</html>
