services:
  simple-kvm:
    container_name: simple-kvm
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    # The app creates and maintains the USB HID gadget itself
    volumes:
      - /sys/kernel/config:/sys/kernel/config
    # Allow opening /dev/hidg0. 236 is the hidg major number on Raspberry Pi OS,
    # check with: grep hidg /proc/devices
    device_cgroup_rules:
      - 'c 236:* rwm'
    environment:
      USTREAMER_URL: 'http://ustreamer:8080'
      ADMIN_USERNAME: '<admin_username>'
      ADMIN_PASSWORD_HASH: '<bcrypt_hash_of_admin_password>'
    depends_on:
      - ustreamer
    restart: unless-stopped

  ustreamer:
    image: pikvm/ustreamer:latest
    container_name: ustreamer
    restart: unless-stopped
    devices:
      - /dev/video0:/dev/video0
    environment:
      EDID: ""
    command:
      - --device=/dev/video0
      - --format=mjpeg
      - --resolution=1920x1080
      - --desired-fps=30
      - --persistent
