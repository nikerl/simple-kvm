<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple KVM</title>
	<script>
		const ws = new WebSocket(`ws://${location.host}/keystroke`);

		function send(type, e) {
			if (ws.readyState !== WebSocket.OPEN) return;
			ws.send(type + ':' + e.code);
			e.preventDefault();
		}

		document.addEventListener('keydown', (e) => { if (!e.repeat) send('down', e); });
		document.addEventListener('keyup', (e) => send('up', e));

		// If the tab loses focus mid-keypress, the keyup never arrives
		window.addEventListener('blur', () => {
			if (ws.readyState === WebSocket.OPEN) ws.send('release_all');
		});
</script>
</head>

<body>
    <h1>IP-KVM</h1>
    
    <img src="{{.UstreamerURL}}" alt="NAS console" style="max-width:100%">
</body>

</html>
