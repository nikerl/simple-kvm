<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple KVM</title>
    <script src="/static/app.js" defer></script>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="shortcut icon" href="/static/assets/favicon.png" type="image/x-icon">
</head>

<body>
    <header>
        <h1><img src="/static/assets/favicon.png" alt="" class="logo">Simple KVM</h1>
		<div class="actions">
			<button id="kbtn">Keyboard</button>
			<button id="dlbtn">Screenshot</button>
		</div>
    </header>

    <main>
        <img id="screen" src="{{.UstreamerURL}}/stream" alt="console">
    </main>

    <input id="kbin" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
</body>

</html>
